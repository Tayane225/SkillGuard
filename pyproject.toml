[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "1.0.0"
description = "Pre-install security auditor for AI agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkillGuard" }]
keywords = ["ai", "agents", "security", "scanner", "mcp", "skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
skillguard = "skillguard.cli:main"

[tool.setuptools.packages.find]
include = ["skillguard*"]
